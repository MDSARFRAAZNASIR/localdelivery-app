apiVersion: apps/v1
kind: Deployment

metadata:
  name: localdelivery-backend
  namespace: localdelivery

spec:
  replicas: 2

  selector:
    matchLabels:
      app: localdelivery-backend

  template:
    metadata:
      labels:
        app: localdelivery-backend

    spec:
      containers:
        - name: backend
          image: mdsarfraaznasir/localdelivery-backend:3ce166305b2f9a4198ae42d172f08c92addb488e

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: localdelivery-backend-config
            - secretRef:
                name: localdelivery-backend-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"                      
