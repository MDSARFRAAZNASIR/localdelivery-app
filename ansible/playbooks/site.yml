---
- name: Inspect LocalDelivery production server
  hosts: production
  gather_facts: true

  vars_files:
    - ../group_vars/production.yml

  tasks:
    - name: Display environment information
      ansible.builtin.debug:
        msg:
          - "Environment: {{ deployment_environment }}"
          - "Application: {{ application_name }}"
          - "Server: {{ server_hostname }}"
          - "Docker Compose directory: {{ docker_compose_directory }}"
          - "Monitoring directory: {{ monitoring_directory }}"

    - name: Display server facts
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_facts['hostname'] }}"
          - "OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "CPU cores: {{ ansible_facts['processor_vcpus'] }}"
          - "Memory: {{ ansible_facts['memtotal_mb'] }} MB"
          - "Python: {{ ansible_facts['python']['executable'] }}"
