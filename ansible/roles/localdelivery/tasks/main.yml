---
# LocalDelivery application role

- name: Check LocalDelivery backend health
  ansible.builtin.uri:
    url: "{{ localdelivery_health_protocol }}://{{ localdelivery_health_host }}:{{ backend_port }}{{ localdelivery_health_path }}"
    method: GET
    status_code: 200
    return_content: true
  register: backend_health
  changed_when: false

- name: Verify backend health response
  ansible.builtin.assert:
    that:
      - backend_health.json.status == "ok"
      - backend_health.json.service == "localdelivery-backend"
    fail_msg: "Backend health response is invalid."
    success_msg: "Backend health response is valid."
- name: Check LocalDelivery frontend health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ frontend_port }}"
    method: GET
    status_code: 200
  register: frontend_health
  changed_when: false
- name: Read currently deployed version
  become: true
  ansible.builtin.slurp:
    src: "{{ docker_compose_directory }}/deployed_version"
  register: deployed_version_file
  changed_when: false

- name: Set deployed image tag
  ansible.builtin.set_fact:
    deployed_image_tag: "{{ deployed_version_file.content | b64decode | trim }}"
- name: Create LocalDelivery role marker
  become: true
  ansible.builtin.copy:
    content: "LocalDelivery role managed by Ansible\n"
    dest: "{{ localdelivery_marker_path }}"
    owner: root
    group: root
    mode: "0644"
- name: Ensure LocalDelivery application is running
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_directory }}"
    state: present
  environment:
    IMAGE_TAG: "{{ deployed_image_tag }}"
  register: localdelivery_compose
  notify: LocalDelivery role configuration changed
