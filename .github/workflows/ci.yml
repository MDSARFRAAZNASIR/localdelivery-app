name: LocalDelivery CI/CD

on:
  push:
    branches:
      - main
      - devops/dockerization

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check index.js


  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/localdelivery-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/localdelivery-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/localdelivery-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/localdelivery-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            cd /opt/localdelivery

            VERSION="${{ github.sha }}"

            echo "======================================"
            echo "Starting deployment"
            echo "New version: $VERSION"
            echo "======================================"

            # ---------------------------------------
            # 1. Save current production version
            # ---------------------------------------

            if [ ! -f deployed_version ]; then
              echo "ERROR: deployed_version does not exist"
              exit 1
            fi

            CURRENT_VERSION=$(cat deployed_version)

            echo "Current production version: $CURRENT_VERSION"

            echo "$CURRENT_VERSION" > previous_version

            # ---------------------------------------
            # 2. Pull new Docker images
            # ---------------------------------------

            export IMAGE_TAG="$VERSION"

            echo "Pulling Docker images..."

            if ! docker compose pull; then
              echo ""
              echo "======================================"
              echo "DEPLOYMENT FAILED"
              echo "Docker image pull failed"
              echo "Starting automatic rollback..."
              echo "======================================"

              ./rollback.sh
              exit 1
            fi

            # ---------------------------------------
            # 3. Start new containers
            # ---------------------------------------

            echo "Starting application..."

            if ! docker compose up -d; then
              echo ""
              echo "======================================"
              echo "DEPLOYMENT FAILED"
              echo "Container startup failed"
              echo "Starting automatic rollback..."
              echo "======================================"

              ./rollback.sh
              exit 1
            fi

            # ---------------------------------------
            # 4. Backend health check
            # ---------------------------------------

            echo "Waiting for backend health..."
            sleep 10

            echo "Checking backend health..."

            if ! curl -fsS http://localhost:5000/health; then
              echo ""
              echo "======================================"
              echo "DEPLOYMENT FAILED"
              echo "Backend health check failed"
              echo "Starting automatic rollback..."
              echo "======================================"

              ./rollback.sh
              exit 1
            fi

            echo ""
            echo "Backend health check passed."

            # ---------------------------------------
            # 5. Public HTTPS health check
            # ---------------------------------------

            echo "Checking production HTTPS health..."

            if ! curl -fsS https://mayadelivery.online/health; then
              echo ""
              echo "======================================"
              echo "DEPLOYMENT FAILED"
              echo "Production HTTPS health check failed"
              echo "Starting automatic rollback..."
              echo "======================================"

              ./rollback.sh
              exit 1
            fi

            echo ""
            echo "Production HTTPS health check passed."

            # ---------------------------------------
            # 6. Mark deployment successful
            # ---------------------------------------

            echo "$VERSION" > deployed_version

            echo ""
            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "Version: $VERSION"
            echo "======================================"

            docker compose ps