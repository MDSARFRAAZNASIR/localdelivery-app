name: K6 API Performance

on:
  workflow_dispatch:

jobs:
  k6-performance:
    name: K6 API Performance Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 products performance test
        run: |
          mkdir -p k6/results
          k6 run \
            --no-thresholds \
            --summary-export=k6/results/products-performance-summary.json \
            k6/ci-products-performance.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-products-performance-results
          path: k6/results/products-performance-summary.json
