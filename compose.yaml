services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localdelivery-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: localdelivery-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend